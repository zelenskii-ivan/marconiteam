services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marconi}
      POSTGRES_USER: ${POSTGRES_USER:-marconi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marconi_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marconi} -d ${POSTGRES_DB:-marconi}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      APP_BASE_URL: ${VITE_SITE_URL:-https://marcony-krd.ru}
      API_CORS_ORIGIN: ${VITE_SITE_URL:-https://marcony-krd.ru}
      DATABASE_URL: postgres://${POSTGRES_USER:-marconi}:${POSTGRES_PASSWORD:-marconi_dev_password}@db:5432/${POSTGRES_DB:-marconi}
      COOKIE_NAME: marconi_session
      PERSONAL_DATA_CONSENT_VERSION: ${PERSONAL_DATA_CONSENT_VERSION:-2026-07-07}
      MARKETING_CONSENT_VERSION: ${MARKETING_CONSENT_VERSION:-2026-07-07}
      PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:-privacy@marconi.local}
      SMS_PROVIDER: ${SMS_PROVIDER:-log}
      EXPOSE_DEBUG_OTP: ${EXPOSE_DEBUG_OTP:-false}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then((res) => { if (!res.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: .
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-https://marcony-krd.ru}
        VITE_YM_COUNTER_ID: ${VITE_YM_COUNTER_ID:-}
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
